version: '3.8'

services:
  backup-bot:
    build: .
    container_name: backup-bot
    restart: unless-stopped
    ports:
      # Bound to localhost only by default — the admin panel has no reason to
      # be reachable directly from the internet. Put it behind a reverse
      # proxy (nginx/Caddy) with TLS if you need remote access, or change
      # this back to "3001:3001" if you understand the risk.
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    volumes:
      # Map the state and log files to the host machine to persist data across container restarts.
      # This creates empty files on the host if they don't exist yet.
      - ./mirror-state.json:/usr/src/app/mirror-state.json
      - ./backups.json:/usr/src/app/backups.json
      - ./processed.json:/usr/src/app/processed.json
      # Ensure your watermark image is accessible
      - ./thenetwork.png:/usr/src/app/thenetwork.png