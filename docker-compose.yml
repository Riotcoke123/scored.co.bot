version: '3.8'

services:
  backup-bot:
    build: .
    container_name: backup-bot
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      # Map the state and log files to the host machine to persist data across container restarts.
      # This creates empty files on the host if they don't exist yet.
      - ./mirror-state.json:/usr/src/app/mirror-state.json
      - ./backups.json:/usr/src/app/backups.json
      - ./processed.json:/usr/src/app/processed.json
      # Ensure your watermark image is accessible
      - ./thenetwork.png:/usr/src/app/thenetwork.png
      # Self-update system: keep update backups and status across container restarts.
      # NOTE: these only survive `docker compose restart` / crash-restarts on the SAME
      # container. Running `docker compose up --build` rebuilds the image from this
      # source tree, which will undo any update applied only through the admin panel —
      # copy admin.js/lib/update-manager.js changes back into your source tree if you
      # want them to survive a rebuild.
      - ./backups:/usr/src/app/backups
      - ./update-state.json:/usr/src/app/update-state.json
      - ./last-update-result.json:/usr/src/app/last-update-result.json